name: Weekly Job Scraper

on:
  schedule:
    # This runs at 01:00 UTC every Friday (which is 4:00 AM in Egypt)
    - cron: '0 1 * * 5'
  workflow_dispatch: # This allows you to trigger the script manually from GitHub

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Job Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_agent.py

      - name: Commit sent_jobs.json state back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sent jobs state" && git pull --rebase origin main && git push)
