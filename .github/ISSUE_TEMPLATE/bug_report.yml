name: 🐛 Bug Report
description: File a bug report to help us fix an issue in Job Agent
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first before submitting.
  - type: textarea
    id: problem-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: dropdown
    id: affected-component
    attributes:
      label: Affected Component
      options:
        - Scrapers (LinkedIn, Glassdoor, Wuzzuf, Bayt, Tanqeeb, Indeed)
        - Scoring Engine & Relevance Calculation
        - Copilot (Email / WhatsApp / ATS Modal)
        - Autopilot Background Worker
        - Desktop Dashboard & Web Backend
        - Task Scheduler / Windows Integration
        - LLM Parsing / Gemini Integration
        - Database & State Management
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs, Console Output, or Screenshots
      description: Paste any error traceback or relevant log lines.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, Browser version.
      placeholder: "Windows 11, Python 3.10.12, Edge 120"
